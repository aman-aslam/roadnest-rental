services:
  postgres:
    image: postgres:16-alpine
    container_name: roadnest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: roadnest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - roadnest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roadnest"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  roadnest_pgdata:
